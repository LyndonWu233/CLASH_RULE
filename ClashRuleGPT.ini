ruleset=  全球直连,[]GEOSITE,category-public-tracker
;ruleset=  全球直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.yaml

