; Download direct policy follows service-specific policies
ruleset=  全球直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.yaml

; 3. Domestic aggregate. Single complete classical file; includes IPv6.
ruleset=  全球直连,clash-classic:https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ChinaMax/ChinaMax_Classical.yaml

; 4. Broad foreign collections, then GeoIP and final fallback
ruleset=  国外媒体,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia_Classical.yaml
ruleset=  国外流量,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy.yaml
ruleset=  全球直连,[]GEOIP,CN,no-resolve
ruleset=  漏网之鱼,[]FINAL

